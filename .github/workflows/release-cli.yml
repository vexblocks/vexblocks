name: Release CLI

on:
  push:
    tags:
      - 'cli-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.1)'
        required: true
        type: string

jobs:
  release:
    name: Build and Publish VexBlocks CLI
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI
        run: pnpm build:cli

      - name: Update version from tag
        if: github.event_name == 'push'
        working-directory: packages/cli
        run: |
          # Extract version from tag (cli-v1.0.1 -> 1.0.1)
          VERSION=${GITHUB_REF_NAME#cli-v}
          echo "Updating to version: $VERSION"
          # Use node to update package.json directly (avoids npm workspace: protocol issues)
          node -e "const pkg = require('./package.json'); pkg.version = '$VERSION'; require('fs').writeFileSync('./package.json', JSON.stringify(pkg, null, '\t') + '\n')"

      - name: Update version (if manual trigger)
        if: github.event_name == 'workflow_dispatch'
        working-directory: packages/cli
        run: |
          VERSION="${{ inputs.version }}"
          node -e "const pkg = require('./package.json'); pkg.version = '$VERSION'; require('fs').writeFileSync('./package.json', JSON.stringify(pkg, null, '\t') + '\n')"

      - name: Publish to npm
        working-directory: packages/cli
        run: npm publish --access public

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: VexBlocks CLI ${{ github.ref_name }}
          body: |
            ## VexBlocks CLI ${{ github.ref_name }}

            Install or update:
            ```bash
            npx @vexblocks/cli@latest init
            ```

            See [CHANGELOG.md](./CHANGELOG.md) for details.
          draft: false
          prerelease: false
